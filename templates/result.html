<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Mensagens</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Análise Completa</h1>

        <!-- Exibir o gráfico -->
        <h3 class="text-center mb-4">Gráfico de Análise</h3>
        <img src="{{ graph_url }}" alt="Gráfico de Análise" class="img-fluid mb-4">

        <!-- Opções de download -->
        <div class="container mt-2">
            <p class="text-center mb-4"><a href="{{ graph_url }}" class="btn btn-primary">Baixar Gráfico</a></p>
        </div>

        <div class="container">
            <p class="text-center mb-4">Arquivo de Excel com total de mensagens por participante: </p>
            <p class="text-center mb-4"><a href="{{ excel_url }}" class="btn btn-secondary">Baixar Arquivo Excel</a></p>
        </div>

    </div>

    <!-- Bootstrap JS and Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
